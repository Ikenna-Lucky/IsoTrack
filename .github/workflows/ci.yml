name: Frontend CI

on:
  push:
    branches: [main, isoTrack-dev-branch, isotrack-preview-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://frontend.example.test
      NEXT_PUBLIC_API_URL: https://backend.example.test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and API client tests
        run: npm run test:unit
      - name: Build production frontend
        run: npm run build
      - name: Check types including generated routes
        run: npm run type-check
