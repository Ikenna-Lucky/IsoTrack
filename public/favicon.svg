<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Diagonal gradient: deep violet (bottom-left) to sky (top-right) -->
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Radial shine on the dots -->
    <radialGradient id="dot" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="36" height="36" rx="9" fill="url(#bg)"/>

  <!-- Subtle inner highlight edge -->
  <rect width="36" height="36" rx="9" stroke="rgba(255,255,255,0.14)" stroke-width="0.8" fill="none"/>

  <!-- Route line connecting the three waypoints -->
  <path
    d="M11 25 Q18 18 25 11"
    stroke="rgba(255,255,255,0.28)"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Origin dot (bottom-left) -->
  <circle cx="11" cy="25" r="3.6" fill="url(#dot)"/>

  <!-- Transit dot (center) -->
  <circle cx="18" cy="18" r="2.3" fill="rgba(255,255,255,0.52)"/>

  <!-- Destination dot (top-right) -->
  <circle cx="25" cy="11" r="3.6" fill="url(#dot)"/>
</svg>
