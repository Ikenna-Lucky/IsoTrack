  -->
  <path
    d="M30 12c0 9-12 18-12 18S6 21 6 12a12 12 0 0 1 24 0Z"
    fill="white"
  />
  <!-- Inner circle eye of the pin -->
  <circle cx="18" cy="12" r="4.5" fill="rgba(0,0,0,0.22)"/>
